# Only needed if you run coturn INSTEAD of LiveKit (i.e. keep the peer-to-peer
# mesh and just add a relay). Install coturn, put this in /etc/turnserver.conf.
# Flask app env:  TURN_URLS=turn:turn.example.org:3478,turn:turn.example.org:3478?transport=tcp,turns:turn.example.org:443?transport=tcp
#                 TURN_SECRET=<same value as static-auth-secret>
listening-port=3478
tls-listening-port=443
realm=turn.example.org
use-auth-secret
static-auth-secret=REPLACE_WITH_openssl_rand_hex_32
fingerprint
no-cli
no-multicast-peers
# Don't let the relay reach private networks:
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
min-port=50000
max-port=60000
cert=/etc/letsencrypt/live/turn.example.org/fullchain.pem
pkey=/etc/letsencrypt/live/turn.example.org/privkey.pem
