services:
  - type: web
    name: liwec
    env: python
    region: oregon          # pick the Render region closest to your Supabase project's region
    plan: starter           # free plan has no persistent disk — see RECORDINGS_DIR note below
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class gthread --threads 4 --timeout 120 -w 1 --bind 0.0.0.0:$PORT app:app"
    # Runs once per deploy, after build, before traffic is switched over.
    # Applies any pending migrations (see migrations/). The app also runs
    # this same sync automatically on every worker boot as a resilient
    # fallback (see _ensure_schema_up_to_date in app.py) in case this step
    # doesn't run — e.g. if the service was ever created outside the
    # render.yaml Blueprint — but keeping it here means a broken migration
    # fails the deploy instead of going live half-broken.
    preDeployCommand: "flask --app app db upgrade"
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render generates and stores a random secret for you
      - key: DB_ENGINE
        value: postgres
      - key: DATABASE_URL
        sync: false               # set manually in the Render dashboard — see note below
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: RECORDINGS_DIR
        value: /var/data/recordings
      - key: VERIFICATION_DOCS_DIR
        value: /var/data/verification_docs   # consultant ID/certificate uploads — sensitive, never publicly served
      # Optional — only needed once. Set these two in the Render dashboard
      # (not here, so the password never gets committed to the repo) to
      # auto-create your first admin account on next deploy. Safe to leave
      # unset entirely if you already have an admin, or delete them again
      # after the account exists — see app.py's _seed_admin_from_env.
      # - key: ADMIN_EMAIL
      #   sync: false
      # - key: ADMIN_PASSWORD
      #   sync: false
    disk:
      name: recordings
      mountPath: /var/data
      sizeGB: 2                   # bumped from 1GB — now also holds verification document uploads

