<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recorder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Opened by the media server's recorder (LiveKit Egress), never by a person. See routes/egress.py. -->
<style>
  /* The recording is the teacher's LESSON WINDOW, full frame: the whiteboard, the slides with their
     drawing, or the teacher's shared screen, whichever is on show. It never shows the teacher's
     face or the students. When nothing is being shown it is a plain card with the lesson title. */
  html, body { margin: 0; height: 100%; background: #05090c; overflow: hidden; font-family: system-ui, "Segoe UI", Arial, sans-serif; color: #fff; }
  #main { position: fixed; inset: 0; background: #05090c; overflow: hidden; }
  #stagevid { position: absolute; inset: 0; }
  #stagevid video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #idle { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0E1A22; text-align: center; padding: 0 60px; }
  #idle b { font-size: 40px; }
  #idle span { font-size: 22px; color: #8FA3AD; }
  #idle.show { display: flex; }
  #slide, #wb, #slideink { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  #slide { background: #000; }
  #wb { background: #fff; }
  #slideink { background: transparent; }
  #slide.show, #wb.show, #slideink.show { display: block; }
</style>
</head>
<body>
<div id="main">
  <div id="stagevid"><video autoplay playsinline muted></video></div>
  <div id="idle" class="show"><b id="title"></b><span>The lesson is in progress</span></div>
  <img id="slide" alt="">
  <canvas id="wb" width="1600" height="900"></canvas>
  <canvas id="slideink" width="1600" height="900"></canvas>
</div>
<script src="{{ url_for('static', filename='js/ink.js') }}"></script>
{% if local_livekit %}
<script src="{{ url_for('static', filename='vendor/livekit-client.umd.min.js') }}"></script>
{% else %}
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.14/dist/livekit-client.umd.min.js"></script>
{% endif %}
<script>
(function () {
  const BASE = "/egress/{{ room_code }}/{{ token }}";
  const LESSON_TITLE = {{ (meeting.title if meeting else "")|tojson }};
  const params = new URLSearchParams(location.search);
  const LK = window.LivekitClient;
  const audioEls = new Map(); // track sid -> element
  const stageVideo = document.querySelector("#stagevid video");
  const idleEl = document.getElementById("idle");
  let stageTrack = null;
  let room = null;
  let boardOpen = false, slideOn = false;   // set by poll() below

  document.getElementById("title").textContent = LESSON_TITLE;

  function meta(p) { try { return JSON.parse(p.metadata || "{}"); } catch (e) { return {}; } }

  const sharePub = (p) => p.getTrackPublication(LK.Track.Source.ScreenShare);
  const live = (pub) => !!(pub && pub.track && !pub.isMuted);

  function setStage(track) {
    if (stageTrack !== track) {
      if (stageTrack) { try { stageTrack.detach(stageVideo); } catch (e) {} }
      if (track) track.attach(stageVideo);
      stageTrack = track;
    }
    stageVideo.style.visibility = track ? "visible" : "hidden";
  }

  // What is on the lesson window? The whiteboard and slides cover everything (poll() below);
  // beneath them it is the teacher's shared screen, else a plain card. Cameras are never shown.
  function layout() {
    if (!room) return;
    const people = Array.from(room.remoteParticipants.values());
    const host = people.find((p) => meta(p).host);
    let share = null;
    if (host && live(sharePub(host))) share = sharePub(host).track;
    setStage(share);
    idleEl.classList.toggle("show", !share && !boardOpen && !slideOn);
  }
  window._relayout = layout;           // poll() calls this when slides/board change what is shown

  function onTrack(track, pub, p) {
    if (track.kind === "video") {
      // Only the teacher's screen is used; every other picture (cameras) is switched off to save bandwidth.
      try {
        if (pub.source === LK.Track.Source.ScreenShare && meta(p).host) pub.setVideoQuality(LK.VideoQuality.HIGH);
        else pub.setSubscribed(false);
      } catch (e) {}
    } else if (track.kind === "audio") {
      const el = track.attach();
      el.style.display = "none";
      document.body.appendChild(el);
      audioEls.set(track.sid, el);
    }
    layout();
  }

  async function start() {
    const url = params.get("url"), token = params.get("token");
    if (!url || !token) return;
    room = new LK.Room({ adaptiveStream: false, dynacast: false });
    room.on(LK.RoomEvent.TrackSubscribed, onTrack);
    room.on(LK.RoomEvent.TrackUnsubscribed, (track) => {
      if (track.kind === "audio") { track.detach().forEach((e) => e.remove()); audioEls.delete(track.sid); }
      layout();
    });
    room.on(LK.RoomEvent.TrackMuted, layout);
    room.on(LK.RoomEvent.TrackUnmuted, layout);
    room.on(LK.RoomEvent.ParticipantConnected, layout);
    room.on(LK.RoomEvent.ParticipantDisconnected, layout);
    room.on(LK.RoomEvent.ParticipantMetadataChanged, layout);
    room.on(LK.RoomEvent.Disconnected, () => console.log("END_RECORDING"));
    await room.connect(url, token, { autoSubscribe: true });
    // Browsers may block audio until a gesture; this page has none.
    try { await room.startAudio(); } catch (e) {}
    layout();
    console.log("START_RECORDING");
  }

  /* ---- slides and whiteboard (not video, so they come from the server) ---- */
  const slideEl = document.getElementById("slide");
  const wbEl = document.getElementById("wb");
  const W = wbEl.width, H = wbEl.height;
  // The same drawing engine the classroom uses (static/js/ink.js), so the recording matches the screen.
  const board = new InkEngine(wbEl);
  let wbVersion = -1, ruler = null;

  board.overlay = function (ctx) {
    if (!ruler || !ruler.on) return;
    const T = 74, UNIT = W / 40, half = ruler.l * W / 2;
    ctx.save(); ctx.translate(ruler.x * W, ruler.y * H); ctx.rotate(ruler.a);
    ctx.fillStyle = "rgba(255,233,160,.78)"; ctx.strokeStyle = "rgba(125,92,0,.95)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.rect(-half, -T / 2, half * 2, T); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(60,42,0,.95)"; ctx.lineWidth = 1.5; ctx.font = Math.round(T * .26) + "px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (let i = 0; i * UNIT <= half * 2 + .5; i++) {
      const x = -half + i * UNIT, len = i % 5 === 0 ? T * .34 : T * .2;
      ctx.beginPath(); ctx.moveTo(x, -T / 2); ctx.lineTo(x, -T / 2 + len); ctx.stroke();
      if (i % 5 === 0 && i > 0) ctx.fillText(String(i), x, -T / 2 + len + 2);
    }
    ctx.restore();
  };

  // The teacher's drawing on slides: a transparent layer exactly over the slide picture.
  const inkEl = document.getElementById("slideink");
  let ink = null, inkKey = "";
  function inkEngine(ratio) {
    const h = Math.round(1600 * ratio);
    if (ink && ink.height === h) return ink;
    const keep = ink ? ink.ops.map((o) => Object.assign({}, o)) : [];
    inkEl.width = 1600; inkEl.height = h;
    ink = new InkEngine(inkEl, { transparent: true });
    if (keep.length) ink.setOps(keep);
    return ink;
  }
  inkEngine(9 / 16);

  async function poll() {
    try {
      const r = await fetch(`${BASE}/state?wb=${wbVersion}&ink=${encodeURIComponent(inkKey)}`, { cache: "no-store" });
      if (r.ok) {
        const s = await r.json();
        const sl = s.slides;
        const wasShown = boardOpen + "|" + slideOn;
        slideOn = !!(sl && sl.active);
        boardOpen = !!(s.wb && s.wb.open);
        if (boardOpen + "|" + slideOn !== wasShown && window._relayout) window._relayout();
        if (sl && sl.active) {
          const src = `${BASE}/slide/${sl.deck_id}/${sl.index + 1}.jpg`;
          if (slideEl.getAttribute("src") !== src) slideEl.src = src;
          slideEl.classList.add("show");
        } else {
          slideEl.classList.remove("show");
        }
        if (s.wb) {
          ruler = s.wb.ruler || null;
          board.setBg(s.wb.bg || "plain");
          if (s.wb.ops) { board.setOps(JSON.parse(JSON.stringify(s.wb.ops))); wbVersion = s.wb.v; }
          else board.present(true);
          wbEl.classList.toggle("show", !!s.wb.open);
        }
        if (s.ink && sl && sl.active) {
          if (slideEl.naturalWidth) inkEngine(slideEl.naturalHeight / slideEl.naturalWidth);
          if (s.ink.ops) { ink.setOps(JSON.parse(JSON.stringify(s.ink.ops))); }
          inkKey = s.ink.key;
          inkEl.classList.add("show");
        } else {
          inkEl.classList.remove("show");
          inkKey = "";
        }
      }
    } catch (e) { /* the next tick tries again */ }
    setTimeout(poll, 1000);
  }

  start().catch((e) => console.error("recorder page failed", e));
  poll();
})();
</script>
</body>
</html>
