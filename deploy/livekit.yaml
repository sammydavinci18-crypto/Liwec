port: 7880
bind_addresses: [""]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
redis:
  address: localhost:6379
keys:
  # Generate with:  openssl rand -hex 16   /   openssl rand -hex 32
  # The SAME pair goes in the Flask app's LIVEKIT_API_KEY / LIVEKIT_API_SECRET.
  REPLACE_API_KEY: REPLACE_API_SECRET
turn:
  enabled: true
  domain: turn.example.org
  # TLS relay on 443 for networks that block everything else. Needs a cert for
  # turn.example.org: see https://docs.livekit.io/home/self-hosting/deployment/
  tls_port: 5349
  udp_port: 3478
