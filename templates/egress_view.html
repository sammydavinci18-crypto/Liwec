<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recorder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Opened by the media server's recorder (LiveKit Egress), never by a person. See routes/egress.py. -->
<style>
  /* The recording is a picture of the whole lesson, like the teacher's own screen:
     a big STAGE on the left (whiteboard, slides, the teacher's shared screen or the
     teacher's camera, whichever is in use), a column on the right with the teacher and
     every student present, and a bar along the bottom with the lesson and who is here. */
  html, body { margin: 0; height: 100%; background: #0E1A22; overflow: hidden; font-family: system-ui, "Segoe UI", Arial, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 320px; grid-template-rows: 1fr 52px; }
  #main { position: relative; background: #05090c; overflow: hidden; grid-column: 1; grid-row: 1; }
  #side { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 6px; padding: 6px; background: #0E1A22; border-left: 1px solid #2B3E45; min-height: 0; }
  #bar { grid-column: 1 / span 2; grid-row: 2; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: #0A1318; border-top: 1px solid #2B3E45; font-size: 15px; min-width: 0; }
  #bar b { white-space: nowrap; max-width: 34%; overflow: hidden; text-overflow: ellipsis; }
  #count { white-space: nowrap; color: #E8C65A; font-weight: 600; }
  #roster { flex: 1; min-width: 0; color: #C9D6DC; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tile { position: relative; background: #0A1318; border: 1px solid #2B3E45; border-radius: 6px; overflow: hidden; min-height: 0; }
  .tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .name { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; text-shadow: 0 1px 3px #000; background: rgba(0,0,0,.5); padding: 1px 7px; border-radius: 4px; }
  .tile .avatar { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #16262f; }
  .tile .avatar span { width: 54px; height: 54px; border-radius: 50%; background: #2A3F6B; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; text-transform: uppercase; }
  .tile.novideo video { visibility: hidden; }
  .tile.novideo .avatar { display: flex; }
  #hostcam { flex: 0 0 auto; aspect-ratio: 16 / 9; }
  #hostcam[hidden] { display: none; }
  #grid { flex: 1; min-height: 0; display: grid; gap: 6px; align-content: start; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 1fr; }
  #stagevid { position: absolute; inset: 0; border: 0; border-radius: 0; }
  #stagevid video { object-fit: contain; }
  #stagevid .name { left: 12px; bottom: 12px; font-size: 16px; }
  #wait { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8FA3AD; font-size: 22px; }
  #slide, #wb, #slideink { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: none; }
  #slide { background: #000; }
  #wb { background: #fff; }
  #slideink { background: transparent; }
  #slide.show, #wb.show, #slideink.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="main">
    <div id="stagevid" class="tile"><video autoplay playsinline muted></video><div class="name" id="stagename" hidden></div></div>
    <div id="wait">Waiting for the teacher&hellip;</div>
    <img id="slide" alt="">
    <canvas id="wb" width="1600" height="900"></canvas>
    <canvas id="slideink" width="1600" height="900"></canvas>
  </div>
  <aside id="side"><div id="hostcam" class="tile" hidden></div><div id="grid"></div></aside>
  <footer id="bar"><b id="title"></b><span id="count"></span><span id="roster"></span></footer>
</div>
<script src="{{ url_for('static', filename='js/ink.js') }}"></script>
{% if local_livekit %}
<script src="{{ url_for('static', filename='vendor/livekit-client.umd.min.js') }}"></script>
{% else %}
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.14/dist/livekit-client.umd.min.js"></script>
{% endif %}
<script>
(function () {
  const BASE = "/egress/{{ room_code }}/{{ token }}";
  const LESSON_TITLE = {{ (meeting.title if meeting else "")|tojson }};
  const MAX_TILES = 12;               // students drawn as pictures; everyone still appears in the bottom bar
  const params = new URLSearchParams(location.search);
  const LK = window.LivekitClient;
  const tiles = new Map(); // identity -> { el, video, name, avatar, initial }
  const audioEls = new Map(); // track sid -> element
  const stageVideo = document.querySelector("#stagevid video");
  const stageName = document.getElementById("stagename");
  const waitEl = document.getElementById("wait");
  const hostcam = document.getElementById("hostcam");
  let stageTrack = null;
  let room = null;
  let boardOpen = false, slideOn = false;   // set by poll() below

  document.getElementById("title").textContent = LESSON_TITLE;

  function meta(p) { try { return JSON.parse(p.metadata || "{}"); } catch (e) { return {}; } }

  function tileFor(p) {
    let t = tiles.get(p.identity);
    if (t) return t;
    const el = document.createElement("div");
    el.className = "tile novideo";
    const video = document.createElement("video");
    video.autoplay = true; video.playsInline = true; video.muted = true; // audio is played separately
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    const initial = document.createElement("span");
    avatar.appendChild(initial);
    const name = document.createElement("div");
    name.className = "name";
    el.append(video, avatar, name);
    t = { el, video, name, avatar, initial, track: null };
    tiles.set(p.identity, t);
    return t;
  }

  const camPub = (p) => p.getTrackPublication(LK.Track.Source.Camera);
  const sharePub = (p) => p.getTrackPublication(LK.Track.Source.ScreenShare);
  const live = (pub) => !!(pub && pub.track && !pub.isMuted);

  // Fill one tile: the camera picture if it is on, otherwise the person's initial, so a student
  // whose camera is off still shows as present.
  function paintTile(t, p, label) {
    const pub = camPub(p);
    const on = live(pub);
    const track = on ? pub.track : null;
    if (t.track !== track) {
      if (t.track) { try { t.track.detach(t.video); } catch (e) {} }
      if (track) track.attach(t.video);
      t.track = track;
    }
    t.el.classList.toggle("novideo", !on);
    const nm = label || p.name || p.identity || "";
    t.name.textContent = nm;
    t.initial.textContent = (nm.trim()[0] || "?");
  }

  function setStage(track, label) {
    if (stageTrack !== track) {
      if (stageTrack) { try { stageTrack.detach(stageVideo); } catch (e) {} }
      if (track) track.attach(stageVideo);
      stageTrack = track;
    }
    stageVideo.style.visibility = track ? "visible" : "hidden";
    stageName.hidden = !(track && label);
    stageName.textContent = label || "";
  }

  function layout() {
    if (!room) return;
    const people = Array.from(room.remoteParticipants.values());
    const host = people.find((p) => meta(p).host);
    const others = people.filter((p) => p !== host).sort((a, b) => (a.name || "").localeCompare(b.name || ""));

    const here = new Set(people.map((p) => p.identity));
    for (const [id, t] of tiles) if (!here.has(id)) { if (t.track) { try { t.track.detach(t.video); } catch (e) {} } t.el.remove(); tiles.delete(id); }

    // What is the stage showing? The whiteboard and slides cover it (poll() below);
    // beneath them it is the teacher's shared screen if there is one, else the teacher's camera.
    let share = null;
    for (const p of (host ? [host] : []).concat(others)) { const pub = sharePub(p); if (live(pub)) { share = { p, track: pub.track }; break; } }
    const hostCam = host && live(camPub(host)) ? camPub(host).track : null;
    if (share) setStage(share.track, (share.p.name || "Screen") + " is sharing their screen");
    else if (hostCam && !boardOpen && !slideOn) setStage(hostCam, null);
    else setStage(null, null);
    waitEl.style.display = (!share && !host) ? "flex" : "none";

    // The teacher always appears: large when their camera is the stage, in the side column otherwise.
    const stageIsHostCam = !!hostCam && !share && !boardOpen && !slideOn;
    hostcam.hidden = !host || stageIsHostCam;
    if (host && !stageIsHostCam) {
      const t = tileFor(host);
      paintTile(t, host, (host.name || "Teacher") + " (teacher)");
      if (t.el.parentNode !== hostcam) { hostcam.innerHTML = ""; hostcam.appendChild(t.el); }
      t.el.style.height = "100%";
    }

    const grid = document.getElementById("grid");
    const shown = others.slice(0, MAX_TILES);
    const cols = shown.length <= 1 ? 1 : 2;
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    // Keep tiles in order with the least DOM churn.
    shown.forEach((p, i) => {
      const t = tileFor(p);
      paintTile(t, p);
      if (grid.children[i] !== t.el) grid.insertBefore(t.el, grid.children[i] || null);
    });
    while (grid.children.length > shown.length) grid.lastChild.remove();

    // The bottom bar names everyone, however many there are.
    const n = others.length;
    document.getElementById("count").textContent = n === 1 ? "1 student present" : n + " students present";
    document.getElementById("roster").textContent = others.map((p) => p.name || "").filter(Boolean).join("  ·  ");
  }
  window._relayout = layout;           // poll() calls this when slides/board change what the stage shows

  function onTrack(track, pub, p) {
    if (track.kind === "video") {
      // Screen shares and the teacher at full quality; the small student tiles at low quality.
      try { pub.setVideoQuality(pub.source === LK.Track.Source.ScreenShare || meta(p).host ? LK.VideoQuality.HIGH : LK.VideoQuality.LOW); } catch (e) {}
    } else if (track.kind === "audio") {
      const el = track.attach();
      el.style.display = "none";
      document.body.appendChild(el);
      audioEls.set(track.sid, el);
    }
    layout();
  }

  async function start() {
    const url = params.get("url"), token = params.get("token");
    if (!url || !token) return;
    room = new LK.Room({ adaptiveStream: false, dynacast: false });
    room.on(LK.RoomEvent.TrackSubscribed, onTrack);
    room.on(LK.RoomEvent.TrackUnsubscribed, (track) => {
      if (track.kind === "audio") { track.detach().forEach((e) => e.remove()); audioEls.delete(track.sid); }
      layout();
    });
    room.on(LK.RoomEvent.TrackMuted, layout);
    room.on(LK.RoomEvent.TrackUnmuted, layout);
    room.on(LK.RoomEvent.ParticipantConnected, layout);
    room.on(LK.RoomEvent.ParticipantDisconnected, layout);
    room.on(LK.RoomEvent.ParticipantMetadataChanged, layout);
    room.on(LK.RoomEvent.Disconnected, () => console.log("END_RECORDING"));
    await room.connect(url, token, { autoSubscribe: true });
    // Browsers may block audio until a gesture; this page has none.
    try { await room.startAudio(); } catch (e) {}
    layout();
    console.log("START_RECORDING");
  }

  /* ---- slides and whiteboard (not video, so they come from the server) ---- */
  const slideEl = document.getElementById("slide");
  const wbEl = document.getElementById("wb");
  const W = wbEl.width, H = wbEl.height;
  // The same drawing engine the classroom uses (static/js/ink.js), so the recording matches the screen.
  const board = new InkEngine(wbEl);
  let wbVersion = -1, ruler = null;

  board.overlay = function (ctx) {
    if (!ruler || !ruler.on) return;
    const T = 74, UNIT = W / 40, half = ruler.l * W / 2;
    ctx.save(); ctx.translate(ruler.x * W, ruler.y * H); ctx.rotate(ruler.a);
    ctx.fillStyle = "rgba(255,233,160,.78)"; ctx.strokeStyle = "rgba(125,92,0,.95)"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.rect(-half, -T / 2, half * 2, T); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(60,42,0,.95)"; ctx.lineWidth = 1.5; ctx.font = Math.round(T * .26) + "px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (let i = 0; i * UNIT <= half * 2 + .5; i++) {
      const x = -half + i * UNIT, len = i % 5 === 0 ? T * .34 : T * .2;
      ctx.beginPath(); ctx.moveTo(x, -T / 2); ctx.lineTo(x, -T / 2 + len); ctx.stroke();
      if (i % 5 === 0 && i > 0) ctx.fillText(String(i), x, -T / 2 + len + 2);
    }
    ctx.restore();
  };

  // The teacher's drawing on slides: a transparent layer exactly over the slide picture.
  const inkEl = document.getElementById("slideink");
  let ink = null, inkKey = "";
  function inkEngine(ratio) {
    const h = Math.round(1600 * ratio);
    if (ink && ink.height === h) return ink;
    const keep = ink ? ink.ops.map((o) => Object.assign({}, o)) : [];
    inkEl.width = 1600; inkEl.height = h;
    ink = new InkEngine(inkEl, { transparent: true });
    if (keep.length) ink.setOps(keep);
    return ink;
  }
  inkEngine(9 / 16);

  async function poll() {
    try {
      const r = await fetch(`${BASE}/state?wb=${wbVersion}&ink=${encodeURIComponent(inkKey)}`, { cache: "no-store" });
      if (r.ok) {
        const s = await r.json();
        const sl = s.slides;
        const wasShown = boardOpen + "|" + slideOn;
        slideOn = !!(sl && sl.active);
        boardOpen = !!(s.wb && s.wb.open);
        if (boardOpen + "|" + slideOn !== wasShown && window._relayout) window._relayout();
        if (sl && sl.active) {
          const src = `${BASE}/slide/${sl.deck_id}/${sl.index + 1}.jpg`;
          if (slideEl.getAttribute("src") !== src) slideEl.src = src;
          slideEl.classList.add("show");
        } else {
          slideEl.classList.remove("show");
        }
        if (s.wb) {
          ruler = s.wb.ruler || null;
          board.setBg(s.wb.bg || "plain");
          if (s.wb.ops) { board.setOps(JSON.parse(JSON.stringify(s.wb.ops))); wbVersion = s.wb.v; }
          else board.present(true);
          wbEl.classList.toggle("show", !!s.wb.open);
        }
        if (s.ink && sl && sl.active) {
          if (slideEl.naturalWidth) inkEngine(slideEl.naturalHeight / slideEl.naturalWidth);
          if (s.ink.ops) { ink.setOps(JSON.parse(JSON.stringify(s.ink.ops))); }
          inkKey = s.ink.key;
          inkEl.classList.add("show");
        } else {
          inkEl.classList.remove("show");
          inkKey = "";
        }
      }
    } catch (e) { /* the next tick tries again */ }
    setTimeout(poll, 1000);
  }

  start().catch((e) => console.error("recorder page failed", e));
  poll();
})();
</script>
</body>
</html>
